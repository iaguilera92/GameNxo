<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="screen-orientation" content="portrait" />
    <title>🎾 Nxo Games</title>
    <link rel="icon" type="image/webp" href="/assets/nxo-logo.webp" />
    <!-- versión web instalable (Añadir a pantalla de inicio, también en iPhone): pantalla completa y sin barras -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nxo Games" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
      #game { width: 100%; height: 100%; }
      /* Celular web con pantalla "baja" (Safari de iPhone con sus barras: 390x664 ≈ 0,59): el juego está pensado
         para 9:16 o más alto; si se ensancha, el menú se encima. Ahí se mantiene 9:16 centrado (franjas negras
         mínimas a los lados). Pantallas 9:16 o más altas (APK, Android, iPhone a pantalla completa) no cambian. */
      @media (orientation: portrait) and (min-aspect-ratio: 9/16) {
        #game { margin: 0 auto; width: min(100%, 100vh * 9 / 16); }
        @supports (height: 100dvh) {
          #game { width: min(100%, (100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 9 / 16); }
        }
      }
      /* ESCRITORIO (ratón y ventana ancha): el juego es vertical, así que se muestra como un celular 9:16 centrado, de todo el
         alto de la ventana y con negro a los lados, en vez de estirarse a pantalla completa. Se detecta por el puntero (ratón =
         hover + pointer fine), no por el user agent: celulares y tablets táctiles no entran aquí y siguen como antes. */
      @media (hover: hover) and (pointer: fine) and (min-aspect-ratio: 9/16) {
        #game { margin: 0 auto; width: calc(100vh * 9 / 16); max-width: 100%; }
        @supports (height: 100dvh) {
          #game { width: calc(100dvh * 9 / 16); }
        }
      }
      /* Instalada en el iPhone (Añadir a inicio): la barra de estado es translúcida; el juego no queda bajo la
         muesca ni bajo la barra de inicio. Solo en modo instalado (la APK y el navegador no lo usan). */
      @media (display-mode: standalone) {
        body { box-sizing: border-box; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
